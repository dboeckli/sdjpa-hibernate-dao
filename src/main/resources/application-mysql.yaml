spring:
  application:
    name: sdjpa-hibernate-dao

  docker:
    compose:
      file: compose-mysql.yaml
      enabled: true
      stop:
        command: down

  sql:
    init:
      mode: never

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bookdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: bookuser
    password: password

  flyway:
    enabled: true
    user: bookadmin
    password: password

management:
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  endpoint:
    configprops:
      # WARNING: SECURITY RISK - DO NOT USE IN PRODUCTION ENVIRONMENT
      # This configuration exposes sensitive data and should only be used for development or testing purposes.
      # Ensure this is disabled in any environment where security is a concern.
      show-values: ALWAYS
    health:
      probes:
        enabled: true
      show-details: always
  info:
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
      mode: full
  httpexchanges:
    recording:
      enabled: true
      include: request_headers, response_headers, session_id, time_taken
  observations:
    annotations:
      enabled: true
    http:
      server:
        requests:
          name: http.server.requests
      client:
        requests:
          name: http-client-requests
  tracing:
    propagation:
      type: w3c
      produce: w3c
      consume: w3c
    baggage:
      enabled: true
      # Specify which baggage fields should be propagated to downstream services
      correlation:
        # Also make baggage available in MDC for logging
        fields:
          - testBaggage
        enabled: true
      # Erlaubt das Empfangen des Headers "baggage: testBaggage=..." der im http request gesetzt wird
      remote-fields:
        - testBaggage
      # KOPIERT den Wert aus dem Baggage in die Span-Labels (Attributes)
      tag-fields:
        - testBaggage
    export:
      otlp:
        enabled: false
      enabled: true
    sampling:
      probability: 1.0

logging:
  level:
    lorg.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

server:
  port: 8080
